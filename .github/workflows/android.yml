name: Build Home Expenses APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          unzip -q HomeExpenses_Android_Project.zip -d buildsrc

      - name: Build APK
        run: |
          cd buildsrc/HomeExpenses
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeExpenses-APK
          path: buildsrc/HomeExpenses/app/build/outputs/apk/debug/app-debug.apk
