
name: Build Home Expenses APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses and install SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          unzip -q HomeExpenses_Android_Project.zip -d buildsrc

      - name: Find project folder
        run: |
          SETTINGS_FILE=$(find buildsrc -name settings.gradle -type f -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            find buildsrc -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found at: $PROJECT_DIR"

      - name: Build Android APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Find and verify APK
        run: |
          APK_PATH=$(find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found"
            find "$PROJECT_DIR" -type f -name "*.apk"
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$APK_PATH")
          echo "APK size: $APK_SIZE bytes"
          ls -lh "$APK_PATH"

          if [ "$APK_SIZE" -lt 100000 ]; then
            echo "ERROR: APK file is too small"
            exit 1
          fi

          mkdir -p release
          cp "$APK_PATH" release/HomeExpenses.apk

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeExpenses-APK
          path: release/HomeExpenses.apk
          if-no-files-found: error
